<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Rohis SMK Pustek Serpong</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0e4d26, #1f8a4c);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #0e4d26;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #1f8a4c;
            outline: none;
            box-shadow: 0 0 5px rgba(31, 138, 76, 0.3);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0e4d26;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1f8a4c;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header">
        <h2>Form Pendaftaran Rohis</h2>
        <p>SMK Pustek Serpong</p>
    </div>

    <form action="#" method="POST">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

         <div class="form-group">
            <label for="kelas">Kelas>
            <select id="kelas" name="kelas" required>
                <option value="" disabled selected>-- Pilih Kelas --</option>
                <option value="X TKR">X TKR</option>
                <option value="X TSM">X TSM</option>
                <option value="X DKV">X DKV</option>
                <option value="X TKJ">X TKJ</option>
                <option value="X AK">X AK</option>
                <option value="X MP">X MP</option>
                <option value="X TM">X TM</option>
                <option value="XI TKR">XI TKR</option>
                <option value="XI TSM">XI TSM</option>
                <option value="XI DKV">XI DKV</option>
                <option value="XI TKJ">XI TKJ</option>
                <option value="XI AK">XI AK</option>
                <option value="XI MP">XI MP</option>
                <option value="XI TM">XI TM</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jurusan">Jurusan</label>
            <select id="jurusan" name="jurusan" required>
                <option value="" disabled selected>-- Pilih Jurusan --</option>
                <option value="TKR">Teknik Kendaraan Ringan (TKR)</option>
                <option value="TSM">Teknik Sepeda Motor (TSM)</option>
                <option value="DKV">Desain Komunikasi Visual</option>
                <option value="TKJ">Teknik Komputer & Jaringan (TKJ)</option>
                <option value="AK">Akuntansi (AK)</option>
                <option value="OTKP">Otomatisasi & Tata Kelola Perkantoran (OTKP)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Jenis Kelamin</label>
            <div class="radio-group">
                <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
                <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
            </div>
        </div>

        <div class="form-group">
            <label for="whatsapp">No. WhatsApp</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
            <label for="alasan">Alasan Ingin Bergabung</label>
            <textarea id="pesan" name="alasan" rows="3" placeholder="Tuliskan motivasi kamu..." required></textarea>
        </div>

    <!-- Isi input form seperti sebelumnya... -->
<button type="button" class="btn-submit" onclick="kirimKeWA()">Bismillah, Gabung Rohis!</button>
</form>    
    
</form>

<script>
function kirimKeWA() {
    // 1. Ambil nilai dari input
    const nama = document.getElementById('nama').value;
    const nis = document.getElementById('nis').value;
    const jurusan = document.getElementById('jurusan').value;
    const jk = document.querySelector('input[name="jk"]:checked')?.value;
    const whatsapp = document.getElementById('whatsapp').value;
    const alasan = document.getElementById('pesan').value;

    // 2. Validasi input sederhana
    if (!nama || !nis || !jurusan || !jk || !whatsapp || !alasan) {
        alert('Harap isi semua kolom formulir!');
        return;
    }

    // 3. Masukkan nomor WhatsApp pengurus (Ganti 628xxx di bawah)
    const noPengurus = "6281211819058"; 

    // 4. Format pesan WhatsApp
    const pesan = `*PENDAFTARAN ROHIS SMK PUSTEK*%0A%0A` +
                  `*Nama:* ${nama}%0A` +
                  `*Kelas:* ${kelas}%0A` +
                  `*Jurusan:* ${jurusan}%0A` +
                  `*Jenis Kelamin:* ${jk}%0A` +
                  `*No. WA:* ${whatsapp}%0A` +
                  `*Alasan:* ${alasan}`;

    // 5. Buka link WhatsApp
    window.open(`https://wa.me/${noPengurus}?text=${pesan}`, '_blank');
}
</script>
    </form>
</div>

</body>
</html>
